repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: debug-statements

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format (src/tests)
        entry: uv run ruff format
        language: system
        files: ^(src|tests)/.*\.pyi?$

      - id: ruff-check
        name: ruff check (src/tests)
        entry: uv run ruff check
        language: system
        files: ^(src|tests)/.*\.pyi?$

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        stages: [pre-push]
