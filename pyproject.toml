[project]
name = "inference-pipeline"
version = "0.1.0"
description = "Utilities for ML/DL threaded pipelines in inference services."
readme = "README.md"
authors = [
    { name = "Max Mantei", email = "max.mantei@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.10,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.0.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]

[tool.mypy]
python_version = "3.13"
files = ["src"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
